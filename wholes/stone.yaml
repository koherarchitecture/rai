    counts_when: "a comparison to a named thing"
  - id: shape
    text: "What shape is it?"
    stem: "It is shaped like "
    kind: fact
    counts_when: "a named shape or a named thing it resembles"
  - id: feel
    text: "How does it feel — rough, smooth, cold, gritty?"
    stem: "It feels "
    kind: fact
    counts_when: "a stated texture or temperature"
  - id: marks
    text: "Does it have any mark, crack, line or speck? Where?"
    stem: "It has "
